name: CI

on:
  push:
    branches: [main]
  pull_request:

# 与 release.yml 对称：关掉增量编译，保证 CI 验证的构建 == 用户拿到的构建。
env:
  CARGO_INCREMENTAL: '0'

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 凭证与个人信息扫描
        run: python3 tools/check_secrets.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked --lib
      - name: 不变量 —— 报文分桶必须等于 sim 分桶
        run: cargo test --locked --lib single_source -- --nocapture

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 工具链由仓库根的 rust-toolchain.toml 钉死（rustup 代理会读它），
      # 这里只负责装 rustup；stable 漂移不会改变 fmt/clippy 的判定。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy（零警告，-D warnings）
        run: cargo clippy --locked --all-targets -- -D warnings
      # 格式是硬门（#38）：报文逐字节敏感的项目，代码格式统一是最便宜的门。
      # 依赖 dtolnay/rust-toolchain@stable，与 release 同步；若 stable 的 rustfmt
      # 输出有变，先在本地 cargo fmt 再推，不要回退成放行。
      - name: cargo fmt --check（硬门）
        run: cargo fmt --all -- --check
