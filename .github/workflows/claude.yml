# Claude Code：在 issue / PR 评论里 @claude，让 Claude 直接干活
# （查代码、答协议问题、开修复 PR 都行，官方 anthropics/claude-code-action）。
#
# ⚠️ 激活条件（二选一，加到仓库 Settings → Secrets → Actions）：
#   - ANTHROPIC_API_KEY ：Claude Console 的 API key（按量付费）
#   - 或把下面 anthropic_api_key 一行换成 claude_code_oauth_token:
#     ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}，并填入本地
#     `claude setup-token` 生成的令牌（Pro/Max 订阅可用，不另计 API 费）
# 在加 secret 之前，@claude 只会让这个 workflow 报错，不影响其他任何东西。

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # 让 Claude 能读 PR 的 CI 结果
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
