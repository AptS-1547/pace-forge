# Claude Code：在 issue / PR 评论里 @claude，让 AI 直接下场干活
# （查代码、答协议问题、开修复 PR，官方 anthropics/claude-code-action）。
#
# ── 激活：三选一，把 secret 加到 Settings → Secrets → Actions ──
#
# 【A. Anthropic】加 secret ANTHROPIC_API_KEY（Claude Console 的 key，按量付费）。
#     下面什么都不用改。
#
# 【B. Claude 订阅】本地跑 `claude setup-token` 生成令牌，加 secret
#     CLAUDE_CODE_OAUTH_TOKEN，再把 anthropic_api_key 一行换成：
#       claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# 【C. DeepSeek key】DeepSeek 官方 Anthropic 兼容端点。直接把 DeepSeek key
#     填进 ANTHROPIC_API_KEY **不行**（端点不对），要走下面注释里的 DeepSeek
#     版步骤：加 secret DEEPSEEK_API_KEY，删掉 Anthropic 版步骤、启用注释块。
#     模型当前用 deepseek-flash，要更强的换 deepseek-v4-pro（两处一起换）。
#
# 没配任何 secret 前，@claude 只会让这一个 workflow 跑失败，无副作用。

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # 让 Claude 能读 PR 的 CI 结果
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # ── Anthropic / 订阅版（默认启用）──
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── DeepSeek 版（走【C】时：删掉上面整步、启用下面整块）──
      # - name: Run Claude Code
      #   id: claude
      #   uses: anthropics/claude-code-action@v1
